  <path
    d="M18 17v18.5c0 6.6 5.4 11.5 14 11.5s14-4.9 14-11.5V17h-8.2v18.1c0 3.3-2.3 5.6-5.8 5.6s-5.8-2.3-5.8-5.6V17z"
    fill="#0d0d0e"
  />
</svg>
