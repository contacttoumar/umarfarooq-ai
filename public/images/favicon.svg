<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Umar Farooq">
  <!--
    Cobalt ground, near-black mark — the same two values the site is built on.
    Deliberately a solid tile rather than a transparent glyph: at 16px in a
